name: Build Job
on:
  push:
    branches:
      - main 

  pull_request:
    branches:
      - main 

  workflow_dispatch:

  schedule:
    - cron: "10 14 * * 1-5" #nightly run at 2AM UTC

permissions:
  contents: read

jobs:
  Build:
     runs-on: ubuntu-latest 
     steps:
       - name: Checkout Code 
         uses: actions/checkout@v5
         with:
           fetch-depth: 0
       - name:  Maven Build 
         run: mvn install

       - name: Upload Build Artifact (WAR)
         uses: actions/upload-artifact@v4
         with:
            name: vprofile-app
            path: target/*.war

      -  name: Notify if build fails 
         if: failure()
         run: echo "Build job failed! Please check logs."

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        with:
          fecth-depth: 0

      - name: Run tests on main branch 
        run: mvn test 
      
      - name: Checkstyle 
        run: mvn checkstyle:checkstyle
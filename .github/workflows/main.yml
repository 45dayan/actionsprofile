name: Build Job
on:
  push:
    branches:
      - main 

  pull_request:
    branches:
      - main 

  workflow_dispatch:

  schedule:
    - cron: "10 14 * * 1-5" #nightly run at 2AM UTC

permissions:
  contents: read

env:
    DOCKERHUB_REPO: 'vprofile-appimage''

jobs:
  Build:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name:  Maven Build 
        run: mvn install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      -  name: Notify if build fails 
         if: failure()
         run: echo "Build job failed! Please check logs."

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - name: Run tests on main branch 
        if: github.ref == 'refs/heads/main'
        run: mvn test 
      - name: Checkstyle 
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      - name: Run tests on other branches 
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis" 

        #security scanning
  Security_Scan: 
    runs-on: ubuntu-latest 
    needs: Build
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Trivy Filesystem  scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs 
          scan-ref: .
          format: json 
          exit-code: 0
          vuln-type: os,library
          output: trivy-results.json

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

  #build and push job for docker images on aws ecr

  BUILD_AND_PUBLISH:
    name: Build_AND_PUBLISH
    runs-on: ubuntu-latest
    environment: production
    needs: [Build, Testing, Security_Scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{secrects.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build, tag, and push image to Docker hub
        id: build-image 
        env:
          IMAGE_TAG: ${{github.sha}}

        run: |
          docker build -f Docker-files/app/multistage/Dockerfile -t dayan45/vprofile-appimage:$IMAGE_TAG .
          docker push dayan45/vprofile-appimage:$IMAGE_TAG 
          

        
        


      



